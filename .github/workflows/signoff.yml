name: klt signoff

# The block's T1 tier state is graded, not hand-read: re-render the
# tier-verdict report from the committed block manifest and byte-compare it
# against the committed verdict of record. A manifest, vendored checklist or
# cited-evidence change without a regenerated record fails here.
# See manifests/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pinned klt
        run: pip install klayout-tools==0.8.0

      - name: Check the item-9 inventory pins against sim/pdk.json and reuse.lock.json
        run: bash sim/tests/test-attest-pins.sh

      # The item-1 freshness gate itself needs xschem and the pinned PDK, so it cannot run
      # here. Its NARROWNESS can: this suite is the negative controls that keep the gate's two
      # tolerated differences (xschem's absolute-path provenance comments, the classified
      # `mm_ok=1` PDK-pin delta) from widening into "ignores everything". A resize, a deleted
      # device, a renamed net, a reordered subckt port list, mm_ok at the wrong value or on the
      # wrong device model must all still read as drift. Needs only bash and python3.
      # See spec/decision-records/0015-item1-netlist-freshness-gate.md.
      - name: Check the item-1 netlist freshness normalization stays narrow
        run: bash design/tests/test-netlist-pin-delta.sh

      # The four per-cell freshness commands are local_only (each re-exports a schematic with
      # `klt netlist`, needing xschem 3.4.7 and the pinned PDK), so they are listed under
      # skipped_checks with their committed outcome. What this step does prove is that every
      # inventoried file still hashes to what the envelope recorded -- which, at the 0.8.0 pin,
      # is the only thing that catches a schematic edit: item-1 input-set binding ships after
      # 0.8.0, so the manifest content_hash is the inventory's own sha256 and does not move
      # when a .sch does. Same division of labour as the item-9 step below.
      - name: Check the item-1 attestation envelope has not drifted
        run: klt signoff --attest 1 --inventory attest/item1.json --check evidence/item1.json --format text

      # cold_start is local_only (needs the pinned PDK, ngspice >= 43 and psp103.osdi), so it is
      # not run here: it is listed under skipped_checks with its committed outcome. File presence
      # and content hashes of every inventoried testbench are still re-verified.
      - name: Check the item-9 attestation envelope has not drifted
        run: klt signoff --attest 9 --inventory attest/item9.json --check evidence/item9.json --format text

      - name: Re-run klt signoff and compare against the committed record
        run: |
          set -uo pipefail
          rc=0
          klt signoff --manifest manifests/sg13cmos5l-bandgap.json \
                      --tiers-doc manifests/design-evidence-tiers.md \
                      --format json > "$RUNNER_TEMP/fresh-signoff.json" || rc=$?
          # 0 = every T1 item met; 3 = grader ran clean, some item unmet.
          # Anything else is a hard error.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::klt signoff exited $rc (expected 0 or 3)"
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/fresh-signoff.json" manifests/sg13cmos5l-bandgap.signoff.json; then
            echo "::error::Fresh klt signoff output differs from manifests/sg13cmos5l-bandgap.signoff.json - the committed record is stale. Regenerate it (see manifests/README.md) in this PR."
            diff <(python3 -m json.tool "$RUNNER_TEMP/fresh-signoff.json") \
                 <(python3 -m json.tool manifests/sg13cmos5l-bandgap.signoff.json) || true
            exit 1
          fi
          echo "Committed signoff record is fresh."

      - name: Re-attest T1 item 10 against the committed envelope
        run: |
          # Exit 0 = still reproduces and passes; 3 = drifted or failing.
          # Checks flagged local_only (none today) are skipped visibly.
          klt signoff --attest 10 --inventory attest/item10.json \
                      --check evidence/item10.json
